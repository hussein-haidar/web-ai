[build]
  # batal build framework; ini static site + Functions
  publish = "."

[build.environment]
  # File ini memang mengandung nilai yang terlihat sebagai "secret" oleh scanner,
  # tapi termasuk kategori PUBLIC / LOCAL-ONLY:
  #  - google-auth-config.js : GOOGLE_CLIENT_ID memang harus tersedia di browser (public)
  #  - config.php            : hanya backend lokal XAMPP (api.php), TIDAK dipakai di Netlify
  #  - netlify/functions/api.js : GOOGLE_CLIENT_ID di sini memang public (client id OAuth bersifat publik)
  # Catatan: JWT_SECRET TIDAK pernah dikirim ke browser & hanya dibaca dari env var.
  SECRETS_SCAN_OMIT_PATHS = "config.php,google-auth-config.js,netlify/functions/api.js"

[functions]
  directory = "netlify/functions"
  node_bundler = "esbuild"

[[redirects]]
  # Sediakan alias sederhana untuk fungsi backend
  from = "/api"
  to = "/.netlify/functions/api"
  status = 200
